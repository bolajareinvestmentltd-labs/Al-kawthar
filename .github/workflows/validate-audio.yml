name: Validate Rabbana audio manifest

on:
  push:
    paths:
      - 'data/rabbana-manifest.json'
      - 'scripts/validate-audio-manifest.js'
  pull_request:
    paths:
      - 'data/rabbana-manifest.json'
      - 'scripts/validate-audio-manifest.js'

jobs:
  validate-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm ci
      - name: Validate audio manifest
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: '0'
        run: npm run validate-audio-manifest
